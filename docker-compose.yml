# Fixed, so the project (and its volumes) don't change with the folder name.
name: gym-ledger-admin

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from the .env file at build time — NEXT_PUBLIC_* vars are baked in at build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: gym-ledger-admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
